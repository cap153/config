# ╭──────────────────────────────────────────────────────────╮
# │                         Plugins                          │
# ╰──────────────────────────────────────────────────────────╯

# 使用tpm管理插件
set -g @plugin 'tmux-plugins/tpm'
# catppuccin theme
set -g @plugin "catppuccin/tmux"
# 光标直接跳转到指定字符，需要安装ruby
set -g @plugin 'schasse/tmux-jump'

# ╭──────────────────────────────────────────────────────────╮
# │                         Themes                           │
# ╰──────────────────────────────────────────────────────────╯

# Options to make tmux more pleasant
set -g mouse on
set -g default-terminal "tmux-256color"
# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

#     ^
#     u
# < n   i >
#     e
#     v
# ╭──────────────────────────────────────────────────────────╮
# │                      copy-mode-vi                        │
# ╰──────────────────────────────────────────────────────────╯
# 按下 前缀 b 往上一个输出跳转，通过`@`定位
bind-key b copy-mode\;\
           send-keys -X start-of-line\;\
           send-keys -X search-backward "@"
# 按下 前缀 空格, 类似于 nvim 的 leap 光标直接跳转到指定字符
set -g @jump-key "Space"    
# k来退出复制模式。
bind-key -T copy-mode-vi k send-keys -X cancel
bind-key -T copy-mode-vi a send-keys -X cancel
bind-key -T copy-mode-vi A send-keys -X cancel
bind-key -T copy-mode-vi Q send-keys -X cancel
bind-key -T copy-mode-vi S send-keys -X cancel
# 可视模式
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# 复制和复制到行尾
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Y send-keys -X begin-selection \; send-keys -X end-of-line \; send-keys -X copy-selection-and-cancel
# 在vi模式下复制模式使用colemak的移动键位
bind-key -T copy-mode-vi n send-keys -X cursor-left
bind-key -T copy-mode-vi u send-keys -X cursor-up
bind-key -T copy-mode-vi e send-keys -X cursor-down
bind-key -T copy-mode-vi i send-keys -X cursor-right
# 快速移动
bind-key -T copy-mode-vi U send-keys -N 5 -X cursor-up
bind-key -T copy-mode-vi E send-keys -N 5 -X cursor-down
# 单词间快速移动
bind-key -T copy-mode-vi W send-keys -N 5 -X next-word-end
bind-key -T copy-mode-vi B send-keys -N 5 -X previous-word
# 行首/行尾移动
bind-key -T copy-mode-vi N send-keys -X start-of-line
bind-key -T copy-mode-vi I send-keys -X end-of-line
# 上/下一个搜索结果以及取消搜索结果高亮
bind-key -T copy-mode-vi = send-keys -X search-again
bind-key -T copy-mode-vi - send-keys -X search-reverse

# ╭──────────────────────────────────────────────────────────╮
# │               Global Vim-like keybindings                │
# ╰──────────────────────────────────────────────────────────╯

# ---- 定义 "分屏模式" 键位表 ----
# (prefix) s -> 进入分屏模式, 等待 n/u/e/i
bind-key s switch-client -T split-mode
# 这个键位表定义了在按下 (prefix)s 之后可以使用的按键
bind-key -T split-mode n split-window -h -b
bind-key -T split-mode u split-window -b
bind-key -T split-mode e split-window
bind-key -T split-mode i split-window -h

# ---- 使用 Leader + Colemak方向键 在窗格间移动 ----
# -r 表示可重复，按住prefix后可以连续按方向键切换，无需重复按prefix
bind-key -r n select-pane -L
bind-key -r u select-pane -U
bind-key -r e select-pane -D
bind-key -r i select-pane -R

# ---- 定义 "标签页模式" 键位表 ----
# (prefix) t -> 进入标签页模式, 等待 u
bind-key t switch-client -T tab-mode
# 这个键位表定义了在按下 (prefix)t 之后可以使用的按键
bind-key -T tab-mode u new-window        # (prefix) t u -> 新建标签页
bind-key -T tab-mode n previous-window   # (prefix) t n -> 切换到上一个(左)标签页
bind-key -T tab-mode i next-window       # (prefix) t i -> 切换到下一个(右)标签页

# ---- 使用方向键调整窗格大小 ----
bind-key -r Up resize-pane -U 5
bind-key -r Down resize-pane -D 5
bind-key -r Left resize-pane -L 5
bind-key -r Right resize-pane -R 5

# ---- prefix n/e/i/u 在分屏之间移动 ----
set -g @vim-tmux-navigator-left 'n'
set -g @vim-tmux-navigator-down 'e'
set -g @vim-tmux-navigator-up 'u'
set -g @vim-tmux-navigator-right 'i'

# ╭──────────────────────────────────────────────────────────╮
# │                         Options                          │
# ╰──────────────────────────────────────────────────────────╯

# 设置前缀为Ctrl+w
set -g prefix C-w
# 前缀为 `(反引号) 
# unbind C-b         # 解除默认的 Ctrl+b 前缀键绑定
# set -g prefix `    # 反引号为唯一前缀
# bind ` send-keys ` # 如果要输入反引号, 连续按两次反引号即可输入一个反引号字符

# 设置 tmux 内部创建新窗口时使用的默认 shell
set-option -g default-shell /bin/zsh

# ---- 针对yazi的配置 ----
# 告诉tmux：“如果你收到了不认识的指令，别管它，直接把它传递给后面的真实终端就行了，可以实现tmux中预览图片
set -g allow-passthrough on
# 告诉所有在终端里运行的程序，这个终端支持什么功能（比如支持256色、支持斜体等）
set -ga update-environment TERM
# 告诉tmux里的程序，您正在使用的“具体是哪一款终端软件”“哦，是Kitty终端！那我就可以使用它独有的、性能超高的图片显示协议！”
set -ga update-environment TERM_PROGRAM

# ---- 设置索引从 1 开始 ----
# 让标签页 (windows) 编号从 1 开始, 而不是 0
set -g base-index 1
# 让窗格 (panes) 编号也从 1 开始
setw -g pane-base-index 1

# 使用`tmux attach`如果不存在 session 将会创建一个新会话
new-session -n $HOST
      
# ╭──────────────────────────────────────────────────────────╮
# │          Auto-install TPM (Tmux Plugin Manager)          │
# ╰──────────────────────────────────────────────────────────╯
# 如果 tpm 插件目录不存在，则自动从 GitHub 克隆，并安装插件
run-shell "if [ ! -d '$HOME/.tmux/plugins/tpm' ]; then \
	echo 'TPM not found, cloning it...' ; \
	mkdir -p '$HOME/.tmux/plugins' ; \
	git clone --depth 1 https://github.com/tmux-plugins/tpm '$HOME/.tmux/plugins/tpm' ; \
	$HOME/.tmux/plugins/tpm/scripts/install_plugins.sh ; \
fi"
    
# 初始化TMUX插件管理器（将此行放在tmux.conf的最底部）
run '$HOME/.tmux/plugins/tpm/tpm'

