# the default speed for mouse movement and scrolling
baseMouseSpeed: 750.0
baseScrollSpeed: 20.0

# the rest of the config defines the layers with their bindings
layers:
  # the first layer is active at start
  - name: initial
    bindings:
      # when a is held for 300ms, activate mouse layer
      a: tap-hold a ; toggle-layer mouse ; 300
      # when d is held for 300ms, activate scroll layer
      g: tap-hold g ; toggle-layer scroll ; 300
      # capslock点击为escape，按下为ctrl
      capslock: tap-hold esc ; leftctrl ; 300
  # a layer for mouse movement
  - name: mouse
    # when true, keys that are not mapped keep their original meaning
    passThrough: true
    bindings:
      # quit mouse layer
      q: layer initial
      # keep the mouse layer active
      space: layer mouse
      l: move  1  0
      j: move -1  0
      k: move  0  1
      i: move  0 -1
      leftalt: speed 4.0
      e: speed 0.3
      capslock: speed 0.1
      f: button left
      d: button middle
      s: button right
  - name: scroll
    # when true, keys that are not mapped keep their original meaning
    passThrough: true
    bindings:
      i: scroll up
      k: scroll down

