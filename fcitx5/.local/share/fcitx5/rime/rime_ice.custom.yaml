patch:
  # 禁用shift切换rime英文
  "ascii_composer/switch_key/Shift_L": noop
  "ascii_composer/switch_key/Shift_R": noop
  # 提高中文（Script Translator）的初始权重
  "translator/initial_quality": 1.2
  # 降低英文（Melt Eng）的初始权重
  "melt_eng/initial_quality": 0.2
  # 降低中英混合词典的权重 (防止 cn_en 里的词干扰)
  "cn_en/initial_quality": 0.2
  # 开启用户中文词频记录（默认已经开启）
  "translator/enable_user_dict": true
  # 强制覆盖 key_binder 中的 search 设置，将其设为空
  "key_binder/search": ""
  # 修改标点映射，让 ` 键在半角状态下直接输出 ` 而不是 ·
  "punctuator/half_shape/`": "`"
  # 1 代表默认英文，0 代表默认中文
  # "switches/@0/reset": 1 
  # 右边shift切换英文并提交
  # "ascii_composer/switch_key/Shift_R": commit_code
